<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ściągnij Gacie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
    		background: #000;
    		width: 100vw;
    		height: 100vh;
    		display: flex;
    		flex-direction: column;
    		justify-content: center;
    		align-items: center;
    		gap: 20px;
    		overflow: hidden;
        }

        video {
            max-width: 100%;
            max-height: 80vh;
        }

		.download-button {
    		width: 500px;
    		height: auto;
		}
    </style>
</head>

<body>

    <video controls autoplay muted playsinline>
        <source src="gacie.mp4" type="video/mp4">
        Twoja przeglądarka nie obsługuje odtwarzania filmu.
    </video>

	<a href="gacie" download="gacie">
  		<img class="download-button" src="sciagnij.png" alt="Ściągnij">
	</a>

</body>
</html>
